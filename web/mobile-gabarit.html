<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Secrétariat particulier · mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:wght@400;500;600;800&family=Martian+Mono:wght@400;600&display=swap">
<style>
/* Identite « Nuit », reprise a l'identique du tableau de bord web, adaptee
   a un ecran de telephone. */
:root{
  color-scheme:dark;
  --paper:#14151A; --surface:#1B1D24; --surface-2:#22252E; --sunken:#101116;
  --ink:#ECEAE5; --ink-2:#A9A79F; --muted:#77746C;
  --rule:#31343E; --rule-soft:#282B33;
  --accent:#E2A03F; --accent-soft:rgba(226,160,63,.13);
  --on-accent:#14151A;
  --ok:#5FAE7C; --warn:#D9A038; --crit:#E2705C;
  --ok-soft:rgba(95,174,124,.14); --warn-soft:rgba(217,160,56,.14); --crit-soft:rgba(226,112,92,.14);
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif; --display-wght:800; --display-tight:-.025em;
  --body:"Figtree","Helvetica Neue",Arial,sans-serif;
  --mono:"Martian Mono",ui-monospace,Consolas,monospace;
  --sc-label:.09em;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 60px}
.k{font-size:10px;font-weight:700;letter-spacing:var(--sc-label);text-transform:uppercase;color:var(--muted)}

header.strip{
  padding:22px 0 14px;border-bottom:2px solid var(--ink);
}
header.strip h1{
  margin:0;font-family:var(--display);font-size:24px;font-weight:var(--display-wght);
  letter-spacing:var(--display-tight);line-height:1;
}
.maj{margin-top:8px;font-family:var(--mono);font-size:12px;color:var(--accent)}

/* ---------- ecran code ---------- */
#ecran-code{padding:40px 0}
#ecran-code p{color:var(--ink-2);font-size:14px}
#code{
  width:100%;font-family:var(--mono);font-size:24px;letter-spacing:.3em;text-align:center;
  padding:14px;background:var(--surface);border:1px solid var(--rule);color:var(--ink);
  margin-top:16px;
}
#code:focus{outline:2px solid var(--accent);outline-offset:2px}
#valider{
  width:100%;margin-top:14px;font-family:var(--body);font-size:13px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;padding:14px;border:1px solid var(--accent);
  background:var(--accent);color:var(--on-accent);cursor:pointer;
}
#valider:active{filter:brightness(1.1)}
#erreur{
  margin-top:14px;padding:11px 14px;background:var(--crit-soft);border:1px solid var(--crit);
  color:var(--crit);font-size:13px;display:none;
}
#erreur.visible{display:block}

/* ---------- panneaux ---------- */
.panel{background:var(--surface);border:1px solid var(--rule);margin-top:18px}
.panel > header{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:11px 14px;border-bottom:1px solid var(--rule);
}
.panel h2{margin:0;font-size:11px;font-weight:700;letter-spacing:var(--sc-label);text-transform:uppercase}
.count{font-family:var(--mono);font-size:11px;color:var(--muted)}
ul{margin:0;padding:0;list-style:none}
.wk li,.rl .item,.proj-tache{padding:11px 14px;border-bottom:1px solid var(--rule-soft)}
.wk li:last-child,.rl .item:last-child,.proj-tache:last-child{border-bottom:0}
.wk .titre,.proj-tache .titre{font-weight:600}
.wk .meta,.proj-tache .meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px}
.wk .due.late,.proj-tache .due.late{color:var(--crit)}
.rl .who{font-weight:600}
.rl .about{color:var(--ink-2);font-size:13px;margin-top:3px}
.vide{padding:14px;color:var(--muted);font-size:13px}

/* ---------- portefeuille ---------- */
.projet{border-bottom:1px solid var(--rule-soft)}
.projet:last-child{border-bottom:0}
.projet > summary{
  padding:13px 14px;cursor:pointer;list-style:none;display:flex;align-items:center;
  justify-content:space-between;gap:10px;
}
.projet > summary::-webkit-details-marker{display:none}
.projet .ptitre{font-family:var(--display);font-weight:700;font-size:15px}
.sev{font-family:var(--mono);font-size:10px;text-transform:uppercase;padding:2px 7px;border:1px solid currentColor}
.sev.ok{color:var(--ok);background:var(--ok-soft)}
.sev.warn{color:var(--warn);background:var(--warn-soft)}
.sev.crit,.sev.retard{color:var(--crit);background:var(--crit-soft)}
.sev.idle{color:var(--muted)}
.projet .taches{padding:0 14px 12px}

#dashboard{display:none}
#dashboard.visible{display:block}
</style>
</head>
<body>
<div class="wrap">
  <header class="strip">
    <h1>Secrétariat particulier</h1>
    <div class="maj" id="maj"></div>
  </header>

  <section id="ecran-code">
    <p class="k">Accès protégé</p>
    <p>Saisissez le code à six chiffres pour ouvrir le tableau de bord.</p>
    <input id="code" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off"
      autocorrect="off" autocapitalize="off" spellcheck="false" maxlength="12" placeholder="••••••">
    <button id="valider" type="button">Ouvrir</button>
    <div id="erreur">Code incorrect. Réessayez.</div>
  </section>

  <section id="dashboard">
    <div class="panel" id="panel-semaine">
      <header><h2>Ma semaine</h2><span class="count" id="count-semaine"></span></header>
      <ul id="liste-semaine"></ul>
    </div>
    <div class="panel" id="panel-relances">
      <header><h2>Relances à valider</h2><span class="count" id="count-relances"></span></header>
      <ul id="liste-relances"></ul>
    </div>
    <div class="panel" id="panel-projets">
      <header><h2>Projets</h2><span class="count" id="count-projets"></span></header>
      <div id="liste-projets"></div>
    </div>
  </section>
</div>

<script>
'use strict';
// Paquet chiffre injecte au moment de l'export (voir outils/exporter-mobile.js).
// Porte le sel, l'IV, le texte chiffre + son etiquette d'authentification et
// le nombre d'iterations PBKDF2 : tout ce qu'il faut pour dechiffrer, sauf le
// code lui-meme, jamais stocke ici ni nulle part sur cette page.
const PAQUET = /*__PAQUET__*/null/*__FIN_PAQUET__*/;

function echapper(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function base64VersOctets(b64) {
  const bin = atob(b64);
  const octets = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) octets[i] = bin.charCodeAt(i);
  return octets;
}

// Derive la cle et dechiffre avec WebCrypto, en reproduisant exactement les
// parametres de server/export.js : PBKDF2-SHA256, AES-256-GCM.
async function dechiffrer(paquet, code) {
  const enc = new TextEncoder();
  const materiau = await crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveKey']);
  const cle = await crypto.subtle.deriveKey(
    {name: 'PBKDF2', salt: base64VersOctets(paquet.sel), iterations: paquet.iterations, hash: 'SHA-256'},
    materiau, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  const texteEtEtiquette = new Uint8Array([
    ...base64VersOctets(paquet.texte), ...base64VersOctets(paquet.etiquette)
  ]);
  const clair = await crypto.subtle.decrypt(
    {name: 'AES-GCM', iv: base64VersOctets(paquet.iv)}, cle, texteEtEtiquette);
  return new TextDecoder().decode(clair);
}

function formatMaj(iso) {
  try {
    const d = new Date(iso);
    const mois = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    return 'Mis à jour le ' + d.getDate() + ' ' + mois[d.getMonth()] + ' à ' + hh + 'h' + mm;
  } catch (e) {
    return '';
  }
}

function rendreSemaine(items) {
  document.getElementById('count-semaine').textContent = items.length;
  const ul = document.getElementById('liste-semaine');
  if (!items.length) { ul.innerHTML = '<li class="vide">Rien de prévu.</li>'; return; }
  ul.innerHTML = items.map((t) => (
    '<li><div class="titre">' + echapper(t.titre) + '</div>' +
    '<div class="meta">' + echapper(t.projetTitre) + (t.echeance ? ' · ' + echapper(t.echeance) : '') + '</div></li>'
  )).join('');
}

function rendreRelances(items) {
  document.getElementById('count-relances').textContent = items.length;
  const ul = document.getElementById('liste-relances');
  if (!items.length) { ul.innerHTML = '<li class="vide">Aucune relance en attente.</li>'; return; }
  ul.innerHTML = items.map((r) => (
    '<li class="item"><div class="who">' + echapper(r.nom) + '</div>' +
    '<div class="about">' + echapper(r.tacheTitre) + ' · ' + echapper(r.projetTitre) + '</div></li>'
  )).join('');
}

function rendreProjets(items) {
  document.getElementById('count-projets').textContent = items.length;
  const conteneur = document.getElementById('liste-projets');
  conteneur.innerHTML = items.map((p) => {
    const sev = p.severite || 'idle';
    const taches = (p.taches || []).map((t) => (
      '<div class="proj-tache"><div class="titre">' + echapper(t.titre) + '</div>' +
      '<div class="meta">' + echapper(t.statut) + (t.echeance ? ' · ' + echapper(t.echeance) : '') + '</div></div>'
    )).join('') || '<div class="vide">Aucune tâche ouverte.</div>';
    return (
      '<details class="projet"><summary>' +
      '<span class="ptitre">' + echapper(p.titre) + '</span>' +
      '<span class="sev ' + echapper(sev) + '">' + echapper(sev) + '</span>' +
      '</summary><div class="taches">' + taches + '</div></details>'
    );
  }).join('');
}

function afficher(instantane) {
  document.getElementById('maj').textContent = formatMaj(instantane.genereLe);
  rendreSemaine(instantane.maSemaine || []);
  rendreRelances(instantane.relances || []);
  rendreProjets(instantane.projects || []);
  document.getElementById('ecran-code').style.display = 'none';
  document.getElementById('dashboard').classList.add('visible');
}

async function tenterOuverture() {
  const champ = document.getElementById('code');
  const erreur = document.getElementById('erreur');
  const code = champ.value.trim();
  erreur.classList.remove('visible');
  if (!code) return;
  try {
    const clair = await dechiffrer(PAQUET, code);
    const instantane = JSON.parse(clair);
    afficher(instantane);
  } catch (e) {
    // Code errone ou paquet corrompu : message clair, on laisse ressaisir.
    // Le code saisi n'est jamais conserve, ni dans une variable persistante
    // ni dans le stockage du navigateur.
    erreur.classList.add('visible');
    champ.value = '';
    champ.focus();
  }
}

document.getElementById('valider').addEventListener('click', tenterOuverture);
document.getElementById('code').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') tenterOuverture();
});
</script>
</body>
</html>
